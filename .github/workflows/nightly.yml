# SPDX-License-Identifier: Apache-2.0
# Roamux nightly (roam-5 / §12.6): the full build + full suite once a capable runner exists
# (roam-36); until then the hermetic slice runs and the Chromium half skips VISIBLY.
name: nightly
on:
  schedule:
    - cron: "0 18 * * *"   # daily, 18:00 UTC = 02:00 CST (UTC+8) the next day
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hermetic-suite:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      # roam-261: the suite plus the disk-image mount case, which is opt-in per tier
      # (REQUIRE_DMG_MOUNT). It is off the push path and off the required `lint` gate for
      # wall-clock and hermeticity reasons, so this scheduled hosted run is its only home
      # that does NOT depend on vars.ROAMUX_CI_CHROMIUM_RUNNER. Not purely hermetic by
      # design — see dmg_mount_decision in test_release_signing.py.
      - name: Hermetic suite + the opt-in disk-image mount (always runs)
        run: REQUIRE_DMG_MOUNT=1 python3 -m unittest discover -s roamux/build/tests -v

  nightly-selfhosted:
    # ROAMUX_CHROMIUM_DEPENDENT: the nightly warm-base build + full Roamux suites (roam-36, §12.6).
    # Arms enumerated exactly: the schedule (runs on the default branch) or a main-only manual
    # dispatch. No non-PR catch-all.
    if: ${{ vars.ROAMUX_CI_CHROMIUM_RUNNER != '' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) }}
    # roam-279 (grill H5 / M9): see ci.yml targeted-suite-selfhosted — the same shared-base group
    # (this job runs the same tier2_job.sh against the same checkout) and the same 12h bound, sized
    # from the cold-build evidence (this workflow's run 29827734729 is the one the 6h default killed).
    concurrency:
      group: roamux-shared-base
      cancel-in-progress: false
      queue: max
    timeout-minutes: 720
    runs-on: [self-hosted, macos, chromium-builder]
    steps:
      - uses: actions/checkout@v4
      # roam-283 (grill H17): ONE artifact directory for the script, the flake report and the upload.
      # Resolved in a step because the `runner` context is not available in job-level env, and
      # published through GITHUB_ENV so the later steps read $ROAMUX_CI_ARTIFACTS / env.ROAMUX_CI_ARTIFACTS.
      - name: Tier-2 artifact directory
        run: |
          d="${RUNNER_TEMP}/tier2-artifacts"
          mkdir -p "$d"
          echo "ROAMUX_CI_ARTIFACTS=$d" >> "$GITHUB_ENV"
      - name: Nightly warm-base build + Roamux suites
        id: tier2
        run: bash roamux/build/ci/tier2_job.sh
      # roam-283: both steps run whenever tier-2 RAN — green or red — and never on a path where the
      # script step was skipped (the hosted kill-switch path skips checkout and the script; a bare
      # always() would then fail the report for the wrong reason and upload nothing). The report reads
      # the per-suite launcher summaries, lists retried / non-success / skipped tests into the step
      # summary and checks retried tests against known_flakes.txt (mode: warn until roam-308 flips it).
      - name: Flake report
        if: always() && steps.tier2.outcome != 'skipped'
        run: python3 roamux/build/ci/flake_report.py --artifacts "$ROAMUX_CI_ARTIFACTS" --ledger roamux/build/ci/known_flakes.txt --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload tier-2 artifacts
        if: always() && steps.tier2.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: tier2-artifacts
          path: ${{ env.ROAMUX_CI_ARTIFACTS }}
          if-no-files-found: warn
          retention-days: 14
